# yt-canvas on its server: the app and a dedicated Cloudflare Tunnel that carries
# https://yt.devhomelab.app to it. Nothing listens publicly; the app is published on
# localhost only, for health checks.
#
# Written next to this file by scripts/deploy.py (mode 0600, never committed):
#   .env      TUNNEL_TOKEN, for the tunnel
#   app.env   the app's accounts keys and settings, YTC_ALLOWED_ORIGINS among them
#   docker compose -f deploy/compose.yml up -d --build
name: yt-canvas

services:
  app:
    build:
      context: ..
    image: yt-canvas:prod
    restart: unless-stopped
    env_file: app.env
    environment:
      YTC_POT_PROVIDER_URL: http://pot:4416
    depends_on:
      - pot
    volumes:
      - data:/data
      - config:/config
    ports:
      - "127.0.0.1:3350:8000"

  # PO tokens for yt-dlp, which YouTube asks for from datacenter IPs like this server's. Only the
  # app reaches it, on this project's network. Its major version matches the bgutil plugin's in
  # backend/requirements.txt.
  pot:
    image: brainicism/bgutil-ytdlp-pot-provider:2.0.2@sha256:d7d34108b76e52c7d3b575fe9e797e4bf41c1b2a08f80c5292eff6f851ce8472
    restart: unless-stopped

  # cloudflared, pinned.
  tunnel:
    image: cloudflare/cloudflared@sha256:9b49eed8f62806d5d45ddf59ecefb5710429598ea6d3fcccd2af938f621b2b07
    restart: unless-stopped
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN: ${TUNNEL_TOKEN:?set in deploy/.env}
    depends_on:
      app:
        condition: service_healthy

volumes:
  # The media cache, and per-user files (YouTube cookie files for yt-dlp, rewritten from the
  # encrypted copies in Convex whenever they're missing).
  data:
  config:
